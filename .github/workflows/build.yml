name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the Xcode project
        id: find
        run: |
          PROJ=$(find . -name "Baton.xcodeproj" -not -path "*/node_modules/*" | head -n 1)
          echo "Found: $PROJ"
          echo "proj=$PROJ" >> "$GITHUB_OUTPUT"

      - name: List what Xcode sees (for debugging)
        run: xcodebuild -list -project "${{ steps.find.outputs.proj }}"

      - name: Build
        run: |
          xcodebuild \
            -project "${{ steps.find.outputs.proj }}" \
            -target Baton \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Baton.app Payload/
          zip -r Baton.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Baton-ipa
          path: Baton.ipa
