name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Apps/Baton/Baton.xcodeproj \
            -scheme "Musical Baton" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      - name: Show errors only
        if: always()
        run: grep -E "error:" build.log | sort -u | head -40 || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/Baton.app Payload/
          zip -r Baton.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Baton-ipa
          path: Baton.ipa
